org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false

# Reduce memory/threads to avoid Gradle daemon crashes on some Windows setups.
org.gradle.daemon=false
org.gradle.workers.max=2

# Workaround: Kotlin incremental cache failures on Windows when project and PUB_CACHE are on different drives.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
